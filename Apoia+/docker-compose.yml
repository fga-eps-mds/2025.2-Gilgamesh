services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mds_apoia
      POSTGRES_USER: apoia_usuario
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apoia_usuario -d mds_apoia"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "sleep 5 && python manage.py runserver 0.0.0.0:8000"
    restart: always
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - POSTGRES_DB=mds_apoia
      - POSTGRES_USER=apoia_usuario
      - POSTGRES_PASSWORD=1234
      - POSTGRES_HOST=db

volumes:
  postgres_data:
