name: Django CI

# Define quando o teste roda
on:
  push:
    # Roda sempre que houver push nestas branches
    branches: [ "main", "master", "fix/ajustes-eventos", "feat/implementacao-testes" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest # Usa uma máquina Linux no servidor do GitHub

    steps:
    # 1. Baixa seu código
    - uses: actions/checkout@v4

    # 2. Instala o Python 3.13
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # 3. Instala as dependências do requirements.txt
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Roda o Pytest
    - name: Run Tests
      # Configura variáveis de ambiente falsas para o Django não reclamar
      env:
        SECRET_KEY: 'django-insecure-test-key'
        DEBUG: 'True'
      run: |
        pytest