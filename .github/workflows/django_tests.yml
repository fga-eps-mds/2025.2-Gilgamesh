name: Django CI

on:
  push:
    branches: [ "main", "develop", "fix/ajustes-eventos", "feat/implementacao-testes" ]
  pull_request:
    # O teste vai rodar quando abrirem PR para essas branches
    branches: [ "main", "develop", "feature/CRUDeventos" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Diz ao GitHub para entrar na pasta Apoia+ antes de rodar comandos
    defaults:
      run:
        working-directory: ./Apoia+

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      env:
        SECRET_KEY: 'django-insecure-test-key'
        DEBUG: 'True'
      run: |
        pytest